    <main>
        <section class="login">
            <header>
                <h1>SimulaVIP - Login</h1>
            </header>
            <div>
                <form id="formLogin" method="post" action="">
                    <input id="inpUser" type="text" name="username" placeholder="Username" autocomplete="off">
                    <input id="inpPass" type="password" name="password" placeholder="Password" autocomplete="off">
                </form>
                <button id="btnLogin" type="submit">Sign in</button>
                <p id="errorLogin"></p>
            </div>
        </section>
        <section class="compra" style="display: none;">
            <button id="btnCerrar">Log out</button>
            <header>
                <h1>SimulaVIP - Purchase</h1>
            </header>
            <div class="compra-section">
                <form id="formCompra" action="">
                    <input id="nombreComprador" type="text" name="nombreComprador" placeholder="Buyer's name" autocomplete="off">
                    <div class="campo-entrada">
                        <label for="cantidadAdultos">Adult tickets - $3,500 each</label>
                        <input id="cantidadAdultos" type="number" name="cantidadAdultos" value="0" step="1" min="0" placeholder="Quantity" autocomplete="off">
                    </div>
                    <div class="campo-entrada">
                        <label for="cantidadNiños">Child tickets - $1,500 each</label>
                        <input id="cantidadNiños" type="number" name="cantidadNiños" value="0" step="1" min="0" placeholder="Quantity" autocomplete="off">
                    </div>
                </form>
                <button id="btnComprar" type="submit">Buy</button>
                <p id="errorCompra"></p>
            </div>
            <div class="resultado" style="display: none;">
                <p id="resComprador"></p>
                <p id="resAdultos"></p>
                <p id="resNinos"></p>
                <p id="resDescuento"></p>
                <div class="total-fila">
                    <p id="resTotal"></p>
                    <button id="btnVolver">Back</button>
                </div>
            </div>
        </section>
    </main> 
    <script src="/SimulaVIP/js/script.js"></script>
    <script src="/js/i18n.js"></script>
<script src="/js/consent.js"></script>
  </body>
