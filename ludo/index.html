  <div class="container">
    <header class="header">
      <a href="/" class="back-link">&larr; Juegos</a>
      <h1 class="logo">Ludo</h1>
    </header>

    <div id="setup-screen" class="screen active">
      <div class="setup-card">
        <h2>Nueva partida</h2>

        <div id="local-options">
          <div class="setup-section">
            <label class="setup-label" id="lbl-count">Cantidad de jugadores</label>
            <div class="player-count-btns" role="group" aria-labelledby="lbl-count">
              <button class="count-btn active" data-count="2" aria-pressed="true">2</button>
              <button class="count-btn" data-count="3" aria-pressed="false">3</button>
              <button class="count-btn" data-count="4" aria-pressed="false">4</button>
            </div>
          </div>
          <div class="setup-section">
            <label class="setup-label" id="lbl-colors">Colores</label>
            <div class="color-options" id="color-options" role="group" aria-labelledby="lbl-colors">
              <div class="color-opt selected" data-color="red" role="button" tabindex="0" aria-pressed="true"><span class="color-dot" style="background:#ef4444" aria-hidden="true"></span> Rojo</div>
              <div class="color-opt selected" data-color="green" role="button" tabindex="0" aria-pressed="true"><span class="color-dot" style="background:#22c55e" aria-hidden="true"></span> Verde</div>
              <div class="color-opt" data-color="yellow" role="button" tabindex="0" aria-pressed="false"><span class="color-dot" style="background:#eab308" aria-hidden="true"></span> Amarillo</div>
              <div class="color-opt" data-color="blue" role="button" tabindex="0" aria-pressed="false"><span class="color-dot" style="background:#3b82f6" aria-hidden="true"></span> Azul</div>
            </div>
          </div>
          <div class="setup-section">
            <label class="setup-label" id="lbl-names">Nombres</label>
            <div id="name-inputs" role="group" aria-labelledby="lbl-names"></div>
          </div>
          <button class="start-btn" id="start-game">Jugar</button>
        </div>


      </div>
    </div>

    <div id="game-screen" class="screen hidden">
      <div class="game-layout">
        <div class="board-wrapper">
          <div class="board" id="board"></div>
        </div>
        <div class="side-panel">
          <div class="turn-display" role="status">
            <span class="turn-label">Turno de</span>
            <span class="turn-name" id="turn-name">-</span>
          </div>
          <div class="dice-area">
            <div class="dice" id="dice" aria-hidden="true">
              <div class="dice-face" id="dice-face">?</div>
            </div>
            <button class="roll-btn" id="roll-btn">Tirar dado</button>
          </div>
          <div class="players-list" id="players-list"></div>
          <div class="game-log" id="game-log" aria-live="polite" aria-atomic="false"></div>
          <button class="quit-btn" id="quit-btn">Salir</button>
        </div>
      </div>
    </div>

    <div id="win-screen" class="screen hidden">
      <div class="win-card">
        <div class="confetti-container" id="confetti" aria-hidden="true"></div>
        <h2 id="win-title">Ganador!</h2>
        <div class="win-trophy">🏆</div>
        <p id="win-message"></p>
        <div class="results-actions">
          <button class="start-btn" id="play-again">Jugar de nuevo</button>
          <a href="/" class="back-btn-results">Volver a Juegos</a>
        </div>
      </div>
    </div>
