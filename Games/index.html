<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0a14">
  <title>Games - nextuser</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
</head>
<body>
  <div class="background-animation">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div class="container">
    <header class="header">
      <a href="/" class="back-link">&larr; Portfolio</a>
      <h1 class="logo">Games</h1>
      <p class="subtitle">Juega en solitario o compite con amigos</p>
    </header>

    <div class="games-grid">
      <a href="/Games/typing/" class="game-card">
        <div class="game-icon icon-typing">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="16" rx="2"/>
            <line x1="6" y1="8" x2="6" y2="8.01"/>
            <line x1="10" y1="8" x2="10" y2="8.01"/>
            <line x1="14" y1="8" x2="14" y2="8.01"/>
            <line x1="18" y1="8" x2="18" y2="8.01"/>
            <line x1="6" y1="12" x2="6" y2="12.01"/>
            <line x1="18" y1="12" x2="18" y2="12.01"/>
            <line x1="8" y1="16" x2="16" y2="16"/>
          </svg>
        </div>
        <div class="game-info">
          <h2 class="game-title">Mecanografia</h2>
          <p class="game-desc">Escribe parrafos contra el tiempo. Mide tu velocidad y precision.</p>
          <div class="game-tags">
            <span class="tag">1 jugador</span>
            <span class="tag tag-mobile">PC</span>
          </div>
        </div>
        <div class="game-arrow">&rarr;</div>
      </a>

      <a href="/Games/ludo/" class="game-card">
        <div class="game-icon icon-ludo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <circle cx="7.5" cy="7.5" r="1.5" fill="currentColor"/>
            <circle cx="16.5" cy="7.5" r="1.5" fill="currentColor"/>
            <circle cx="7.5" cy="16.5" r="1.5" fill="currentColor"/>
            <circle cx="16.5" cy="16.5" r="1.5" fill="currentColor"/>
            <circle cx="12" cy="12" r="1.5" fill="currentColor"/>
          </svg>
        </div>
        <div class="game-info">
          <h2 class="game-title">Ludo</h2>
          <p class="game-desc">El clasico juego de mesa. Lleva tus fichas a casa antes que los demas.</p>
          <div class="game-tags">
            <span class="tag">2-4 jugadores</span>
            <span class="tag tag-mobile">PC</span>
            <span class="tag tag-mobile">Mobile</span>
          </div>
        </div>
        <div class="game-arrow">&rarr;</div>
      </a>
    </div>

    <footer class="footer">
      <p>Mas juegos proximamente...</p>
    </footer>
  </div>
</body>
</html>
