<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0a14">
  <meta name="description" content="Typing game: type paragraphs against the clock and measure your speed, accuracy and errors.">
  <link rel="canonical" href="https://nextuser.lat/en/Games/typing/">
  <link rel="alternate" hreflang="es" href="https://nextuser.lat/Games/typing/">
  <link rel="alternate" hreflang="en" href="https://nextuser.lat/en/Games/typing/">
  <link rel="alternate" hreflang="x-default" href="https://nextuser.lat/Games/typing/">
  <meta property="og:title" content="Typing - Games">
  <meta property="og:description" content="Typing game: type paragraphs against the clock and measure your speed, accuracy and errors.">
  <meta property="og:url" content="https://nextuser.lat/en/Games/typing/">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://nextuser.lat/og-cover.jpg">
  <meta property="og:site_name" content="Elí Núñez">
  <meta property="og:locale" content="en_US">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Typing - Games">
  <meta name="twitter:description" content="Typing game: type paragraphs against the clock and measure your speed, accuracy and errors.">
  <meta name="twitter:image" content="https://nextuser.lat/og-cover.jpg">
  <meta name="robots" content="index, follow">
  <title>Typing - Games</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/Games/typing/style.css?v=2">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⌨️</text></svg>">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9123517935698561" crossorigin="anonymous"></script>
</head>
<body>
  <div class="background-animation">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>

  <div class="container">
    <header class="header">
      <a href="/en/Games/" class="back-link">&larr; Games</a>
      <h1 class="logo">Typing</h1>
    </header>

    <div id="menu-screen" class="screen active">
      <div class="menu-card">
        <h2>Set up game</h2>
        <div class="setup-section">
          <label class="setup-label">Duration</label>
          <div class="duration-buttons">
            <button class="dur-btn" data-time="30">30s</button>
            <button class="dur-btn active" data-time="60">60s</button>
            <button class="dur-btn" data-time="120">120s</button>
          </div>
        </div>
        <button class="start-btn" id="start-solo">Play</button>
      </div>
    </div>

    <div id="game-screen" class="screen hidden">
      <div class="game-header">
        <div class="timer-display" id="timer">60</div>
      </div>
      <div class="player-area">
        <div class="paragraph-display" id="solo-text"></div>
        <input type="text" id="solo-input" class="typing-input" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Start typing...">
        <div class="stats-bar">
          <div class="stat"><span class="stat-label">WPM</span><span class="stat-value" id="solo-wpm">0</span></div>
          <div class="stat"><span class="stat-label">Accuracy</span><span class="stat-value" id="solo-acc">100%</span></div>
          <div class="stat"><span class="stat-label">Errors</span><span class="stat-value" id="solo-errors">0</span></div>
        </div>
      </div>
    </div>

    <div id="results-screen" class="screen hidden">
      <div class="results-card">
        <h2 id="results-title">Results</h2>
        <div id="results-content"></div>
        <div class="results-actions">
          <button class="start-btn" id="play-again">Play again</button>
          <a href="/en/Games/" class="back-btn-results">Back to Games</a>
        </div>
      </div>
    </div>
  </div>

  <script src="/Games/typing/app.js?v=2"></script>
  <script src="/js/i18n.js"></script>
</body>
</html>
