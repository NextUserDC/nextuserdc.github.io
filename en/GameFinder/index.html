<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Finder</title>
    <meta name="description" content="Search and find the best video game deals on legitimate stores.">
    <link rel="canonical" href="https://nextuser.lat/en/GameFinder/">
    <link rel="alternate" hreflang="es" href="https://nextuser.lat/GameFinder/">
    <link rel="alternate" hreflang="en" href="https://nextuser.lat/en/GameFinder/">
    <link rel="alternate" hreflang="x-default" href="https://nextuser.lat/GameFinder/">
    <meta name="robots" content="index, follow">
    <link rel="stylesheet" href="/GameFinder/style.css">
    <meta property="og:title" content="GameFinder - Best video game deals">
    <meta property="og:description" content="Search and compare video game prices on legitimate stores.">
    <meta property="og:url" content="https://nextuser.lat/en/GameFinder/">
    <meta property="og:type" content="website">
    <meta name="theme-color" content="#0a0a14">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://api.cheapshark.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="shortcut icon" href="/GameFinder/logo.png" type="image/x-icon">
<script type="text/plain" data-nu-track="ads" data-src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9123517935698561" crossorigin="anonymous"></script>
</head>
<body>
    <div class="background-animation"></div>
    
    <main class="container">
        <header>
            <h1 class="logo">Game <span>Finder</span></h1>
            <p class="subtitle">Find the best prices in official stores</p>
        </header>

        <section class="search-section">
            <form id="search-form" class="search-box">
                <div class="input-wrapper">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M11 19C15.4183 19 19 15.4183 19 11C19 6.58172 15.4183 3 11 3C6.58172 3 3 6.58172 3 11C3 15.4183 6.58172 19 11 19Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M21.0004 21.0004L16.6504 16.6504" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <input type="text" id="search-input" placeholder="Search game" autocomplete="off" required>
                </div>
                <button type="submit" id="search-btn">Search</button>
            </form>
        </section>

        <nav class="tabs-header">
            <button class="tab-btn active" data-tab="deals">Legitimate Deals</button>
            <button class="tab-btn" data-tab="other">Other Sites</button>
        </nav>

        <div id="loading-state" class="hidden">
            <div class="spinner"></div>
            <p>Searching for deals...</p>
        </div>

        <div id="tab-deals" class="tab-panel active">
            <div id="official-stores-container" class="official-stores-grid"></div>
            <h3 class="section-divider">Deals at other stores</h3>
            <section id="results-container" class="results-grid">
            </section>
            <div id="empty-state" class="hidden">
                <p>No results found. Try another name.</p>
            </div>
        </div>

        <div id="tab-other" class="tab-panel">
            <section id="other-sites-container" class="sites-grid">
            </section>
            <div id="other-empty-state" class="hidden">
                <p>Type a game name and select "Other Sites" to see the search links.</p>
            </div>
        </div>
    </main>

    <script src="/GameFinder/app.js" defer></script>
    <script src="/js/i18n.js"></script>
<footer class="nu-legal-bar" style="margin:32px 16px 16px;padding:14px 16px;border-top:1px solid rgba(148,163,184,.25);display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:center;font:400 13px/1.4 system-ui,-apple-system,sans-serif;color:#94a3b8;background:rgba(18,18,28,.6);border-radius:12px;"><nav style="display:flex;gap:16px;flex-wrap:wrap;"><a href="/en/privacidad.html" style="color:#a78bfa;text-decoration:none;">Privacy</a><a href="/en/cookies.html" style="color:#a78bfa;text-decoration:none;">Cookies</a><a href="/en/terminos.html" style="color:#a78bfa;text-decoration:none;">Terms</a><a href="/en/cookies.html" data-nu-consent-manage style="color:#a78bfa;text-decoration:none;">Manage cookies</a></nav><span>&copy; 2026 El&iacute; Alexander N&uacute;&ntilde;ez Su&aacute;rez</span></footer>
  <script src="/js/consent.js"></script>
  </body>
</html>
