    <body>
        <header>
            <a href="inicio.html" class="headerLogo">
                <img src="/Photobooth/src/favicon.png" alt="PhotoBooth - Logo">
                <h1>PhotoBooth</h1>
            </a>
        </header>
        <main>
            <div class="loginPage"> 
                <div class="loginCard">
                    <h2 id="tituloFormulario">Sign In</h2>
                    <form id="formularioLogin" class="formulario">
                        <label for="inputLoginUsuario">Username</label>
                        <input type="text" id="inputLoginUsuario" placeholder="Enter your username">
                        <label for="inputLoginPassword">Password</label>
                        <input type="password" id="inputLoginPassword" placeholder="Enter your password">
                        <p id="errorLogin"></p>
                        <button type="submit">Sign In</button>
                    </form>
                    <form id="formularioRegistro" class="formulario" style="display:none;">
                        <label for="inputRegNombre">Full name</label>
                        <input type="text" id="inputRegNombre" placeholder="Enter your name">
                        <label for="inputRegTelefono">Phone</label>
                        <input type="text" id="inputRegTelefono" placeholder="e.g. 912345678">
                        <label for="inputRegEmail">Email address</label>
                        <input type="text" id="inputRegEmail" placeholder="e.g. email@example.com">
                        <label for="inputRegUsuario">Username</label>
                        <input type="text" id="inputRegUsuario" placeholder="Create a username">
                        <label for="inputRegPassword">Password</label>
                        <input type="password" id="inputRegPassword" placeholder="Create a password">
                        <p id="errorRegistro"></p>
                        <button type="submit">Sign Up</button>
                    </form>
                    <p class="toggleForm">Don't have an account? <a href="#" id="toggleRegistro">Sign up here</a></p>
                    <p class="toggleForm" style="display:none;" id="toggleLoginTexto">Already have an account? <a href="#" id="toggleLogin">Sign in</a></p>
                </div>
            </div>
        </main>
        <footer>
            <div class="footerContenido">
                <div class="footerSeccion">
                    <h4>PhotoBooth</h4>

                    <p>Santiago de Chile, Metropolitan Region</p>
                    <p>+56 9 7774 5816</p>
                    <p>eli.alexandern11@gmail.com</p>
                </div>
            </div>
            <div class="footerCopyright">
                <p>&copy; 2026 PhotoBooth - Photo Booth Rentals. All rights reserved.</p>
            </div>
        </footer>
        <script src="/Photobooth/js/app.js"></script>
        <script src="/js/i18n.js"></script>
    </body>
