<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Accounts</title>
    <meta name="description" content="Search for non-premium Minecraft accounts. Find usernames, passwords and IPs instantly.">
    <link rel="canonical" href="https://nextuser.lat/en/MCAccounts/">
    <link rel="alternate" hreflang="es" href="https://nextuser.lat/MCAccounts/">
    <link rel="alternate" hreflang="en" href="https://nextuser.lat/en/MCAccounts/">
    <link rel="alternate" hreflang="x-default" href="https://nextuser.lat/MCAccounts/">
    <link rel="shortcut icon" href="/MCAccounts/logo.ico" type="image/x-icon">
    <link rel="stylesheet" href="/MCAccounts/style.css">
    <meta name="robots" content="index, follow">
    <link rel="preload" href="/MCAccounts/db_indexed.json" as="fetch" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" media="print" onload="this.media='all'">
    <noscript>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    </noscript>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9123517935698561" crossorigin="anonymous"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-gamepad"></i> Minecraft Accounts - NO PREMIUM</h1>
        </header>

        <div class="search-section">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Type the username to search..." aria-label="Search Minecraft user">
                <button id="searchBtn" aria-label="Search"><i class="fas fa-search"></i> Search</button>
                <button id="clearBtn" aria-label="Clear search"><i class="fas fa-broom"></i> Clear</button>
            </div>
        </div>

        <div class="info-section">
            <p id="fileInfo"><i class="fas fa-database"></i> Loading database...</p>
        </div>

        <div class="results-section">
            <div id="resultsCount" class="results-count"></div>
            <div id="resultsContainer" class="results-container"></div>
        </div>

        <div id="loading" class="loading hidden">
            <i class="fas fa-spinner fa-spin"></i> Searching...
        </div>

        <div id="toast" class="toast hidden" role="alert" aria-live="polite"></div>
    </div>

    <script src="/MCAccounts/script.js" defer></script>
    <script src="/js/i18n.js"></script>
</body>
</html>
